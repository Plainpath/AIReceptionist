<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradie Quotes — phone preview</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #eef0f4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
  }
  .caption {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7690;
  }
  .device {
    position: relative;
    width: 380px;
    height: 780px;
    border-radius: 54px;
    background: linear-gradient(155deg, #2b2f38, #121419 60%);
    padding: 14px;
    box-shadow:
      0 40px 70px -20px rgba(15, 20, 30, 0.5),
      0 10px 24px -8px rgba(15, 20, 30, 0.4),
      inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .device::before {
    content: "";
    position: absolute;
    right: -3px;
    top: 150px;
    width: 3px;
    height: 90px;
    background: #1a1d24;
    border-radius: 2px 0 0 2px;
  }
  .device::after {
    content: "";
    position: absolute;
    left: -3px;
    top: 116px;
    width: 3px;
    height: 46px;
    background: #1a1d24;
    border-radius: 0 2px 2px 0;
    box-shadow: 0 60px 0 0 #1a1d24, 116px 0 0 0 transparent;
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: #fff;
  }
  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 30px;
    background: #05070c;
    border-radius: 18px;
    z-index: 5;
    pointer-events: none;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 4px;
    border-radius: 999px;
    background: rgba(0,0,0,0.35);
    z-index: 5;
    pointer-events: none;
  }
  .reload {
    border: none;
    background: #1b2333;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="caption">Tradie Quotes &middot; live app, phone preview</div>
  <div class="device">
    <div class="screen">
      <div class="island"></div>
      <iframe id="app" src="http://localhost:8081" title="Tradie Quotes app"></iframe>
      <div class="home-indicator"></div>
    </div>
  </div>
  <button class="reload" onclick="document.getElementById('app').src = document.getElementById('app').src">Reload app</button>
</body>
</html>
